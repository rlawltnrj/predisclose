name: Bug
description: A crash, an error result, or anything else that does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not write details of any undisclosed vulnerability here.** Issues are public.
        If the bug only shows with your own finding's keywords or notes, replace them with
        made-up ones that still show it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, output, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: queries
    attributes:
      label: Output of --show-queries (optional)
      description: Lists the public requests that were sent. Contains no finding details.
      render: text
  - type: input
    id: version
    attributes:
      label: predisclose version and Python version
      placeholder: predisclose 0.1.1, Python 3.12
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
