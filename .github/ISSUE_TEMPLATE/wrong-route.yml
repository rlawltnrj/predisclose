name: Wrong reporting channel
description: 'The "Where to report" answer points somewhere the project does not ask for.'
labels: ["route"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not write details of any undisclosed vulnerability here.** Issues are public.
        We only need the project and the channel; leave out what you found.
  - type: input
    id: repo
    attributes:
      label: Repository
      placeholder: owner/name
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What predisclose said
      description: Paste the "Where to report" line from `predisclose route owner/name`.
      render: text
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: The channel the project actually asks for
      description: A link to the project's own policy page or file that says so.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: predisclose version
      placeholder: "0.1.1 (see: pip show predisclose)"
